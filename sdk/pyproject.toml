[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniedu"
version = "0.1.0rc1"
description = "Official toolkit for the Omni-Edu K-12 learning and teaching models (4B / 9B / 27B)."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Omni-Edu contributors" }]
keywords = ["education", "k-12", "llm", "multimodal", "tutoring", "omniedu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Education",
]

# The core install only covers the remote-endpoint path.  Local inference and
# Hub downloads are opt-in extras so that "connect to a running vLLM server"
# stays a small install.
dependencies = [
    "pillow>=9.0",
    "openai>=1.30",
]

[project.optional-dependencies]
# `accelerate` is required by the local backend: it loads the checkpoint with
# device_map="auto" so a 4B/9B/27B model lands on the available GPUs.  The
# weights themselves come through `transformers`, which already depends on
# huggingface_hub, so there is no separate download extra.
transformers = ["torch>=2.2", "transformers>=4.44", "accelerate>=0.30"]
# The benchmark suite (`omniedu eval`).  `eval-local` adds the heavy pieces a
# few scorers need: the EDUMATH MaC classifier and the MathTutorBench reward
# model both load torch checkpoints locally.
eval = [
    "httpx>=0.27",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "langdetect>=1.0.9",
    "immutabledict>=4.0",
    "nltk>=3.8",
    # LongTutor's R-L column is `rouge_score`'s rougeL (with its stemming
    # tokenizer), the same call the official scorer makes.
    "rouge-score>=0.1.2",
]
eval-local = ["torch>=2.2", "transformers>=4.44", "pyyaml>=6.0"]
dev = ["pytest>=7.0", "build"]

[project.scripts]
omniedu = "omniedu.cli:main"

[project.urls]
Homepage = "https://github.com/haolpku/Omni-Edu"
Repository = "https://github.com/haolpku/Omni-Edu"
Issues = "https://github.com/haolpku/Omni-Edu/issues"
"Model weights" = "https://huggingface.co/OpenDCAI"
"Instruction data" = "https://huggingface.co/datasets/OpenDCAI/Omni-Edu"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omniedu = [
    "tasks.json",
    "eval/benchmarks.json",
    "eval/judge/prompts/*",
    "eval/vendor/ifeval_official/*.py",
    "eval/clean/*/*.json",
    "eval/mathtutorbench/configs/*.yaml",
    "eval/mathtutorbench/clean_datasets/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:omniedu.*"]

[tool.black]
line-length = 100
# The IFEval scorer is vendored verbatim from google-research/ifeval; it must
# stay byte-identical upstream code.
extend-exclude = "vendor"

[tool.isort]
profile = "black"
line-length = 100
skip_glob = ["*/vendor/*"]
